<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Minimal CSP: block <object>/<embed> plugin injection and <base>-tag
         hijacking (two vectors this app never uses). Deliberately NO default-src
         / script-src / connect-src here — those would need 'unsafe-inline'
         anyway (inline font onload + splash script) and an allowlist of QZ Tray's
         local print websockets that can't be validated without a real printer,
         and a <meta> CSP is enforce-only (no report-only). Revisit only if the
         QZ Tray websocket origins can be pinned. -->
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#060810" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DailyOffice" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>DailyOffice — Your Workspace, Simplified</title>
    <meta name="description" content="DailyOffice — Arya Designs' workspace: inventory, brand tags, packing, cash challans, purchase orders and product costing." />
    <!-- A sign-in-only workspace: keep it out of search results. A robots.txt
         Disallow would be WRONG here — it stops crawlers reading this tag and
         leaves bare URLs indexable when linked. noindex is the correct signal. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://dailyoffice.aryadesigns.co.in/" />
    <!-- Link previews (WhatsApp, iMessage…) for everything shared from here —
         rate cards (#/rc/…), program shares, tracked short links (#/s/…) — all
         resolve to this one document, so the preview carries the brand the
         customer knows. og:image must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DailyOffice" />
    <meta property="og:title" content="Arya Designs" />
    <meta property="og:description" content="Rate cards, catalogs and product links from Arya Designs." />
    <meta property="og:url" content="https://dailyoffice.aryadesigns.co.in/" />
    <!-- 1200×630 and under 300 KB: WhatsApp drops larger previews (audit L10). -->
    <meta property="og:image" content="https://dailyoffice.aryadesigns.co.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Arya Designs" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet"></noscript>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  </head>
  <body>
    <div id="splash" style="position:fixed;inset:0;background:#060810;display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s ease">
      <div style="text-align:center;animation:splashIn .6s cubic-bezier(.2,.9,.3,1) both">
        <div style="width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#6366F1,#38BDF8);display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:800;font-size:32px;color:#fff;margin:0 auto 16px;box-shadow:0 10px 40px rgba(99,102,241,.45)">D</div>
        <div style="font-family:'Sora',sans-serif;font-size:18px;font-weight:700;color:#E2E8F0;letter-spacing:-0.3px">DailyOffice</div>
        <div style="font-size:10px;color:#6B7890;margin-top:6px;letter-spacing:2px;text-transform:uppercase;font-family:'Inter',sans-serif">Loading workspace</div>
        <div style="width:32px;height:3px;border-radius:2px;background:linear-gradient(90deg,#6366F1,#818CF8);margin:18px auto 0;animation:splashBar 1.2s ease-in-out infinite"></div>
      </div>
    </div>
    <style>
      @keyframes splashIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
      @keyframes splashBar{0%,100%{transform:scaleX(1);opacity:.6}50%{transform:scaleX(2.5);opacity:1}}
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>if(window.location.hash.startsWith('#/s/')){var _sp=document.getElementById('splash');if(_sp)_sp.style.display='none';}var _sr=false;new MutationObserver(function(m,o){if(!_sr&&document.getElementById('root').children.length){_sr=true;var s=document.getElementById('splash');if(s){s.style.opacity='0';setTimeout(function(){if(s.parentNode)s.remove()},400)}o.disconnect()}}).observe(document.getElementById('root'),{childList:true})</script>
  </body>
</html>
