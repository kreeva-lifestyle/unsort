<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Minimal CSP: block <object>/<embed> plugin injection and <base>-tag
         hijacking (two vectors this app never uses). Deliberately NO default-src
         / script-src / connect-src here — those would need 'unsafe-inline'
         anyway (inline font onload + splash script) and an allowlist of QZ Tray's
         local print websockets that can't be validated without a real printer,
         and a <meta> CSP is enforce-only (no report-only). Revisit only if the
         QZ Tray websocket origins can be pinned. -->
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#060810" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DailyOffice" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preload" as="image" href="/crest.webp" />
    <title>DailyOffice — Your Workspace, Simplified</title>
    <meta name="description" content="DailyOffice — Arya Designs' workspace: inventory, brand tags, packing, cash challans, purchase orders and product costing." />
    <!-- A sign-in-only workspace: keep it out of search results. A robots.txt
         Disallow would be WRONG here — it stops crawlers reading this tag and
         leaves bare URLs indexable when linked. noindex is the correct signal. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://dailyoffice.aryadesigns.co.in/" />
    <!-- Link previews (WhatsApp, iMessage…) for everything shared from here —
         rate cards (#/rc/…), tracked short links (#/s/…) — all
         resolve to this one document, so the preview carries the brand the
         customer knows. og:image must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DailyOffice" />
    <meta property="og:title" content="Arya Designs" />
    <meta property="og:description" content="Rate cards, catalogs and product links from Arya Designs." />
    <meta property="og:url" content="https://dailyoffice.aryadesigns.co.in/" />
    <!-- 1200×630 and under 300 KB: WhatsApp drops larger previews (audit L10). -->
    <meta property="og:image" content="https://dailyoffice.aryadesigns.co.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Arya Designs" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet"></noscript>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  </head>
  <body>
    <!-- The branded launch: painted before any script, taken over by
         src/lib/launch.ts (one sheen on the crest, then it flies into the
         header's brand slot as the app shows). The crest sits outside the
         splash so it can fly while the splash fades. -->
    <div id="splash" style="position:fixed;inset:0;z-index:9998;background:radial-gradient(420px 360px at 50% 44%,#0f1324,#060810 70%)">
      <div class="splash-text" style="position:absolute;left:0;right:0;top:calc(50% + 82px);text-align:center;font-family:'Sora',sans-serif;font-weight:600;font-size:13px;letter-spacing:.42em;text-indent:.42em;color:#d4b86a;animation:splashIn .22s cubic-bezier(.2,.9,.3,1) .12s both">ARYA DESIGNS</div>
      <div class="splash-text" style="position:absolute;left:0;right:0;top:calc(50% + 112px);text-align:center;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:10.5px;letter-spacing:.18em;text-indent:.18em;text-transform:uppercase;color:#6b7890;animation:splashIn .22s cubic-bezier(.2,.9,.3,1) .2s both">DailyOffice</div>
    </div>
    <div id="splash-crest" style="position:fixed;left:50%;top:50%;z-index:9999;width:128px;height:128px;margin:-82px 0 0 -64px;border-radius:50%;overflow:hidden;pointer-events:none;animation:splashIn .32s cubic-bezier(.2,.9,.3,1) both">
      <img src="/crest.webp" alt="" width="128" height="128" style="display:block;width:100%;height:100%;border-radius:50%">
      <div style="position:absolute;inset:0;-webkit-mask:url(/crest.webp) center/contain no-repeat;mask:url(/crest.webp) center/contain no-repeat"><i id="splash-sheen" style="position:absolute;top:-10%;bottom:-10%;left:-60%;width:60%;background:linear-gradient(100deg,transparent 20%,rgba(255,250,235,.85) 50%,transparent 80%);transform:translateX(-10%)"></i></div>
    </div>
    <style>@keyframes splashIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){#splash-crest,.splash-text{animation:none}}.no-launch #splash,.no-launch #splash-crest{display:none}</style>
    <!-- Public pages (short links, the rate card, password recovery) never paint the launch: decided at parse time, before the bundle. -->
    <script>if(/^#\/(s|rc)\//.test(location.hash)||location.hash.indexOf('type=recovery')>-1)document.documentElement.classList.add('no-launch')</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Safety net only. Once the bundle runs, src/lib/launch.ts owns the
         splash (html.launching) and its own give-up ends it. If the bundle has
         not run by 7 s the splash says so and waits; if it never runs, the
         splash goes at ~19 s so the page can never be stuck behind it. -->
    <script>(function(){var n=0;function tick(){var s=document.getElementById('splash');if(!s||document.documentElement.classList.contains('launching'))return;if(++n<3){var t=s.querySelector('.splash-text:last-child');if(t)t.textContent='Still loading\u2026';setTimeout(tick,6000);return}['splash','splash-crest'].forEach(function(id){var e=document.getElementById(id);if(e)e.remove()})}setTimeout(tick,7000)})()</script>
  </body>
</html>
