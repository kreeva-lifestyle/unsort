name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Manual re-run. Needed on 2026-08-06: the build for 68dab1f sat queued for
  # 15 minutes without ever being assigned a runner (runner_id 0), then GitHub
  # cancelled it and skipped the deploy — main was merged but the site was
  # never rebuilt. Nothing in the repo failed. If that happens again, re-run
  # from the Actions tab; a push to main also re-triggers this workflow.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Queue Pages deploys instead of cancelling in-flight ones. Cancelling a
  # deployment mid-flight leaves GitHub Pages with a stuck "pending" state,
  # which makes the NEXT deploy fail with "Deployment failed, try again later."
  # This matches GitHub's official Pages workflow (cancel-in-progress: false).
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
